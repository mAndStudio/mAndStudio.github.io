<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MStudio 手作鈎織</title>
  <meta name="description" content="MStudio 手作鈎織：手工鈎織小物、玫瑰吊飾與飲料提袋。IG 私訊購買。">
  <meta name="keywords" content="MStudio 手作鈎織,鈎織,手作,鉤織,吊飾">
  <link rel="canonical" href="https://mstudiocrochet.github.io/">
  <meta property="og:title" content="MStudio 手作鈎織">
  <meta property="og:description" content="MStudio 手作鈎織：手工鈎織小物、玫瑰吊飾與飲料提袋。">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://mstudiocrochet.github.io/">
  <script type="application/ld+json">
  {"@context":"https://schema.org","@type":"Store","name":"MStudio 手作鈎織","url":"https://mstudiocrochet.github.io/","description":"手工鈎織小物、玫瑰吊飾與飲料提袋。"}
  </script>
  <style>
    html, body {
      margin: 0;
      background: #fff;
      color: #222;
      font-family: "Segoe UI", "Microsoft JhengHei", sans-serif;
    }

    body {
      padding-bottom: 64px;
    }

    .hero {
      position: relative;
      width: 100%;
      height: 172px;
      overflow: hidden;
      background-color: #111;
      background-image: url("pic/page/bg.jpg");
      background-repeat: repeat;
      background-size: 115px 172px;
      background-position: 0 0;
    }

    .hero img {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 408px;
      height: 612px;
      transform: translate(-50%, -50%);
    }

    .tabs {
      display: flex;
      align-items: stretch;
      box-sizing: border-box;
      height: 48px;
      background: #fff;
      border-bottom: 1px solid #e4e4e4;
    }

    .tabs a {
      flex: 0 0 auto;
      box-sizing: border-box;
      height: 100%;
      padding: 0 20px;
      display: inline-flex;
      align-items: center;
      white-space: nowrap;
      text-decoration: none;
      color: #333;
      font-size: 16px;
    }

    .tabs a[aria-current="page"] {
      color: #111;
      font-weight: 600;
      box-shadow: inset 0 -2px 0 #111;
    }

    .catalog {
      height: auto;
      padding: 16px;
    }

    .intro h1 {
      margin: 0 0 16px;
      font-size: 20px;
    }

    .intro h2 {
      margin: 24px 0 8px;
      font-size: 18px;
    }

    .intro p {
      margin: 0 0 8px;
      font-size: 16px;
      line-height: 1.6;
    }

    .intro img {
      max-width: 100%;
      height: auto;
    }

    .intro a {
      color: #145072;
      text-decoration: none;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 16px;
    }

    @media (max-width: 768px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }

    .product img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      display: block;
      background: #f3f3f3;
    }

    .product .name {
      margin: 8px 0 0;
      font-size: 18px;
      font-weight: 700;
    }

    .product a {
      color: inherit;
      text-decoration: none;
    }

    .product .price,
    .catalog > .price,
    .detail-price .price {
      margin: 4px 0 0;
      font-size: 16px;
      color: #e10600;
    }

    .detail-price {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 4px 0 16px;
    }

    .detail-price .price {
      margin: 0;
      font-size: 19px;
    }

    .add-cart {
      background: #ffbf40;
      border: 1px solid #e0a020;
    }

    .detail-price .add-cart {
      height: 32px;
      padding: 0 12px;
      font-size: 14px;
      cursor: pointer;
    }

    .product .order {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
    }

    .product .order input[type="number"] {
      width: 72px;
      box-sizing: border-box;
      padding: 4px 6px;
      font-size: 16px;
    }

    .product .order button {
      height: 32px;
      padding: 0 10px;
      font-size: 14px;
      cursor: pointer;
    }

    .detail-hero {
      margin: 0 0 12px;
    }

    .detail-hero img {
      width: 100%;
      max-width: 520px;
      aspect-ratio: 1;
      object-fit: cover;
      display: block;
      background: #f3f3f3;
    }

    .detail-thumbs {
      display: flex;
      flex-wrap: nowrap;
      gap: 8px;
      overflow-x: auto;
      margin: 0 0 16px;
      padding-bottom: 8px;
    }

    .detail-thumbs button {
      flex: 0 0 auto;
      width: 88px;
      height: 88px;
      padding: 0;
      border: 2px solid transparent;
      background: #f3f3f3;
      cursor: pointer;
    }

    .detail-thumbs button.is-current {
      border-color: #111;
    }

    .detail-thumbs img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .describe h1, .describe h2, .describe h3 {
      margin: 16px 0 8px;
    }

    .describe p {
      margin: 0 0 12px;
      font-size: 16px;
      line-height: 1.6;
    }

    .back {
      display: inline-block;
      margin-bottom: 16px;
      color: #145072;
    }

    .buy-bar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 64px;
      height: 56px;
      background: #fff;
      border-top: 1px solid #e4e4e4;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 12px;
      padding: 0 16px;
      box-sizing: border-box;
    }

    .buy-bar button {
      position: relative;
      height: 40px;
      padding: 0 24px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      background: #d7f0d7;
      border: 1px solid #b7d8b7;
    }

    #cart-count {
      position: absolute;
      top: -8px;
      right: -8px;
      min-width: 18px;
      height: 18px;
      padding: 0 5px;
      box-sizing: border-box;
      border-radius: 9px;
      background: #e10600;
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      line-height: 18px;
      text-align: center;
    }

    #cart-count.is-empty {
      display: none;
    }

    .cart-panel {
      display: none;
      position: fixed;
      left: 16px;
      right: 16px;
      bottom: 128px;
      max-height: 40vh;
      overflow: auto;
      background: #fff;
      border: 1px solid #e4e4e4;
      padding: 12px 16px;
      box-sizing: border-box;
    }

    .cart-panel.is-open {
      display: block;
    }

    .cart-panel h2 {
      margin: 0 0 8px;
      font-size: 16px;
    }

    .cart-panel ul {
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .cart-panel li {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 8px 0;
      border-top: 1px solid #eee;
    }

    .cart-panel .empty {
      margin: 0;
      color: #666;
    }

    .contact {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: 64px;
      background: #d7eefb;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      padding: 0 16px;
      box-sizing: border-box;
    }

    .contact a {
      display: flex;
      line-height: 0;
    }

    .contact img {
      width: 40px;
      height: 40px;
    }
  </style>
</head>
<body>
  <header class="hero">
    <img src="pic/page/title.png" alt="m.studio" width="408" height="612">
  </header>
  <nav class="tabs" aria-label="頁面">
    <a href="index.html" aria-current="page">首頁</a>
    <a href="products.html">商品</a>
  </nav>
  <main class="catalog intro" id="home-content">
    <p>載入中…</p>
  </main>


  <footer class="contact">
    <a href="https://www.instagram.com/m_and_studio/" target="_blank" rel="noopener noreferrer">
      <img src="pic/page/instagram.png" alt="Instagram" width="40" height="40">
    </a>
  </footer>
  <script>
    async function loadHome() {
      const box = document.getElementById("home-content");
      try {
        const response = await fetch("pic/page/home.html");
        if (!response.ok) {
          throw new Error("missing home.html");
        }
        box.innerHTML = await response.text();
      } catch (err) {
        box.innerHTML = "<p>無法載入首頁內容。</p>";
      }
    }

    loadHome();
  </script>

</body>
</html>
