server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name miastudio.103.253.147.97.nip.io 103.253.147.97;

    root /var/www/miastudio;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location /pic/products/ {
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
    }
}
